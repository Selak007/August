<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>August</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { min-width: 260px; }
    .panel { min-height: unset; padding-bottom: 12px; }
    .open-panel-btn {
      display: block;
      margin: 10px 12px 0;
      padding: 8px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      width: calc(100% - 24px);
      transition: opacity 0.15s;
    }
    .open-panel-btn:hover { opacity: 0.85; }
    .popup-cmd { margin: 10px 12px 0; }
  </style>
</head>
<body>
  <div class="panel">
    <header class="panel-header">
      <span class="logo"><img src="icons/icon32.png" width="16" height="16" alt="August" class="logo-icon" /> AUGUST</span>
      <span class="badge" id="badge">…</span>
    </header>
    <section class="card">
      <div class="label">STATUS</div>
      <div class="value" id="status">Checking…</div>
    </section>
    <div class="dev-row popup-cmd">
      <input type="text" id="cmd" class="dev-input" placeholder="Type a command, press Enter" />
    </div>
    <button class="open-panel-btn" id="open-panel">Open Side Panel &amp; Listen</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
